<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eletro Bosch V2</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #11141C;
            --navbar-bg: #11141C;
            --card-bg: #1E232F;
            --text-color: #EAEAEA;
            --text-muted: #B0B0B0;
            --primary-color: #A033FF; 
            --secondary-color: #33C6FF; 
            --font-main: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: var(--navbar-bg);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand { font-size: 1.5rem; font-weight: 700; }
        .navbar-links { display: flex; gap: 20px; }
        .navbar-links a { text-decoration: none; color: var(--text-color); font-weight: 600; transition: color 0.3s; }
        .navbar-links a:hover { color: var(--secondary-color); }

        .hero { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 0 50px; gap: 50px; }

        .bot-icon-container {
            width: 200px; height: 200px; border-radius: 50%;
            background: rgba(160, 51, 255, 0.1);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 30px rgba(160, 51, 255, 0.3);
        }

        .hero-title { font-size: 3rem; font-weight: 700; margin-bottom: 10px; }
        .hero-subtitle { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }
        .action-buttons { display: flex; gap: 20px; }

        .btn {
            padding: 15px 30px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px;
            cursor: pointer; transition: 0.3s; color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;
        }
        .btn:hover { transform: translateY(-5px); }
        .btn-purple { background: var(--primary-color); box-shadow: 0 5px 15px rgba(160, 51, 255, 0.4); }
        .btn-blue { background: var(--secondary-color); box-shadow: 0 5px 15px rgba(51, 198, 255, 0.4); }

        .about-section { padding: 100px 50px; text-align: center; }
        .about-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 50px; }
        .about-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; max-width: 1000px; margin: 0 auto; }
        .about-card { background-color: var(--card-bg); padding: 30px; border-radius: 12px; transition: 0.3s; }
        .about-card:hover { transform: translateY(-5px); }
        .about-card-icon { font-size: 2rem; color: var(--secondary-color); margin-bottom: 10px; }
        .about-card-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 10px; }
        .about-card-text { color: var(--text-muted); }

        .footer { padding: 30px 50px; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-muted); font-size: 0.9rem; }

        @media (max-width: 900px) {
            .hero { flex-direction: column; height: auto; padding-top: 150px; padding-bottom: 50px; }
            .action-buttons { flex-direction: column; }
            .about-cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">Eletro Bosch V2</div>
    </nav>

    <main id="home" class="hero">
        <div class="bot-icon-container">
            <i class="fas fa-robot" style="font-size: 80px; color: var(--primary-color);"></i>
        </div>
        <div class="hero-content">
            <h1 class="hero-title">Eletro Bosch V2</h1>
            <p class="hero-subtitle">Modern ve Eğlenceli Jubbio Botu!</p>
            <div class="action-buttons">
                <a href="https://jubbio.com/oauth2/authorize?client_id=abd43c3d2524c658442120772811679f&response_type=code&scope=bot+applications.commands+applications.commands.permissions.update&permissions=8" class="btn btn-purple" target="_blank">
                    <i class="fas fa-plus-circle"></i> Botu Ekle
                </a>
                <a href="https://jubbio.com/invite/7UQDsZOZ" class="btn btn-blue" target="_blank">
                    <i class="fas fa-headset"></i> Destek Sunucusu
                </a>
            </div>
        </div>
    </main>

    <section id="about" class="about-section">
        <h2 class="about-title">Hakkımızda</h2>
        <div class="about-cards">
            <div class="about-card">
                <div class="fas fa-cloud about-card-icon"></div>
                <div class="about-card-title">Platform</div>
                <p class="about-card-text">Jubbio</p>
            </div>
            <div class="about-card">
                <div class="fas fa-terminal about-card-icon"></div>
                <div class="about-card-title">Prefix</div>
                <p class="about-card-text">E!</p>
            </div>
            <div class="about-card">
                <div class="fas fa-user-code about-card-icon"></div>
                <div class="about-card-title">Geliştirici</div>
                <p class="about-card-text">ugurcan</p>
            </div>
            <div class="about-card">
                <div class="fas fa-globe about-card-icon"></div>
                <div class="about-card-title">Dil</div>
                <p class="about-card-text">Türkçe</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>Eletro Bosch V2 | © 2026 Geliştirici: ugurcan.</p>
    </footer>

</body>
  </html>
